<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>
<body class="login-page-body">
    <nav class="top-nav">
        <div class="brand">Library Management System</div>
    </nav>

    <main class="login-page">
        <div class="login-card">
            <section class="login-content" style="text-align:center;">
                <p class="welcome-tag">Session ended</p>
                <h1>You have logged out</h1>
                <p class="subtext">Thank you for using the Library Management System.</p>

                <a href="./login.html" class="primary-btn" style="display:inline-block; text-decoration:none; margin-top:20px;">Login again</a>
            </section>

            <section class="login-visual" aria-hidden="true">
                <div class="illustration">
                    <div class="screen"></div>
                    <div class="laptop-base"></div>
                    <div class="document"></div>
                    <div class="floating-card"></div>
                    <div class="badge-dot dot-one"></div>
                    <div class="badge-dot dot-two"></div>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
