<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Login</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>
<body class="login-page-body">
    <nav class="top-nav">
        <div class="brand">Library Management System</div>
    </nav>

    <main class="login-page">
        <div class="login-card">
            <section class="login-content">
                <p class="welcome-tag">Welcome back!</p>
                <h1>Welcome</h1>
                <p class="subtext">Access your library workspace</p>

                <form class="login-form">
                    <div class="input-group">
                        <span class="input-icon">✉</span>
                        <input type="email" placeholder="Email address" aria-label="Email address">
                    </div>

                    <div class="input-group">
                        <span class="input-icon">🔒</span>
                        <input type="password" placeholder="Password" aria-label="Password">
                    </div>

                    <div class="form-options">
                        <label class="remember-me"><input type="checkbox"> Remember me</label>
                        <a href="#">Forgot password?</a>
                    </div>

                    <a href="./admin_dashboard.html" class="primary-btn" style="display: inline-block; text-align: center; text-decoration: none;">Login</a>
                </form>
            </section>

            <section class="login-visual" aria-hidden="true">
                <div class="illustration">
                    <div class="screen"></div>
                    <div class="laptop-base"></div>
                    <div class="document"></div>
                    <div class="floating-card"></div>
                    <div class="badge-dot dot-one"></div>
                    <div class="badge-dot dot-two"></div>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
